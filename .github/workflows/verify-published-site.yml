name: Verify migrated M Vertica website
on:
  push:
    branches: [import/mvertica-site]
    paths: [.github/workflows/verify-published-site.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh complete published files and portable deployment settings
        run: |
          python3 scripts/complete-published-import.py
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run build
      - name: Install isolated browser test tools
        run: |
          npm install --prefix .verification-tools --no-save --package-lock=false agent-browser playwright
          .verification-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check the production build in a real browser
        run: |
          mkdir -p .verification-tools/evidence
          node scripts/serve.mjs dist > .verification-tools/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl --silent --fail http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          CHROME=$(node -p "require('./.verification-tools/node_modules/playwright').chromium.executablePath()")
          .verification-tools/node_modules/.bin/agent-browser --executable-path "$CHROME" open http://127.0.0.1:4173/
          .verification-tools/node_modules/.bin/agent-browser wait .site-shell
          .verification-tools/node_modules/.bin/agent-browser snapshot -i > .verification-tools/evidence/interactive-elements.txt
          .verification-tools/node_modules/.bin/agent-browser screenshot .verification-tools/evidence/initial-page.png
          .verification-tools/node_modules/.bin/agent-browser close
          node scripts/verify-site.cjs
      - name: Store verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvertica-browser-verification
          path: .verification-tools/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit recovered files and verification report to migration branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public docs scripts README.md package.json package-lock.json vercel.json .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'Record portable language routes and real-browser migration checks'
            git push origin HEAD:import/mvertica-site
          fi
