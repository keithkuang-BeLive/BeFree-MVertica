name: Recover published M Vertica website
on:
  push:
    branches: [import/mvertica-site]
    paths: [.github/workflows/recover-published-site.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover all published files, including dynamic media and Chinese artwork
        run: python3 scripts/complete-published-import.py
      - name: Validate the deployment package
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run build
          test -s dist/index.html
          test -s dist/analytics.js
          test -s dist/assets/ski-family-freedom-zh.webp
          test -s vercel.json
      - name: Save recovered files to this migration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public docs scripts README.md package.json package-lock.json vercel.json .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete published M Vertica site assets and deployment files'
            git push origin HEAD:import/mvertica-site
          fi
